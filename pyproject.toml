[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skinova-wellcomet-simulator"
version = "1.1.0"
description = "Skinova / Wellcomet ultrasound device physics simulator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Skinova Simulator Contributors" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[project.scripts]
skinova-sim = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.setuptools.package-data]
app = ["templates/*", "static/css/*", "static/js/*"]
"*" = ["locales/*.json", "config/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
