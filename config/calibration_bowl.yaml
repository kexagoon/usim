# CALIBRATION_PRESET — model parameters for the acoustic bowl (чаша) stack.
# NOT published factory dimensions. Edit freely; UI shows calibration badge.
# Hard manufacturer anchors: ERA=3.0 cm², I_max=0.5 W/cm², P_ac_max=1.5 W,
# allowed f0 ∈ {1,3,10,19} MHz (home defaults still 10/19), face titanium (+PVD on 19),
# tissue c=1540 m/s, gel Z≈1.5 MRayl, air Z≈400 Rayl.

CALIBRATION_PRESET: true
label: "Kalibrierung / калибровка — keine Werksmaße"

anchors:
  era_cm2: 3.0
  i_max_w_cm2: 0.5
  p_ac_max_w: 1.5
  f0_hz_options: [1000000, 3000000, 10000000, 19000000]
  c_tissue_m_s: 1540
  z_gel_mrayl: 1.5
  z_air_rayl: 400

era_derived:
  d_eq_mm: 19.54

materials:
  # --- Piezo ---
  pzt4:
    name: PZT-4
    rho_kg_m3: 7500
    c_m_s: 4600
    z_mrayl: 34.5
    attenuation_np_m_mhz: 4.0
    kt: 0.70
    help: "Hard PZT-4; typ. power transducers — Modellparameter."
  pzt5a:
    name: PZT-5A
    rho_kg_m3: 7750
    c_m_s: 4350
    z_mrayl: 33.7
    attenuation_np_m_mhz: 8.0
    kt: 0.70
    help: "Weicherer PZT; höhere Dämpfung — Modellparameter."
  pzt8:
    name: PZT-8
    rho_kg_m3: 7600
    c_m_s: 4200
    z_mrayl: 31.9
    attenuation_np_m_mhz: 5.0
    kt: 0.64
    help: "Modellparameter; typ. PZT-8. Dicke ≈ λ/2 bei f0 in Keramik."
  batio3:
    name: BaTiO3
    rho_kg_m3: 5700
    c_m_s: 5100
    z_mrayl: 29.1
    attenuation_np_m_mhz: 6.0
    kt: 0.50
    help: "Bariumtitanat — alternative Keramik (Kalibrierung)."
  piezo_custom:
    name: Custom piezo
    rho_kg_m3: 7600
    c_m_s: 4200
    z_mrayl: 31.9
    attenuation_np_m_mhz: 5.0
    kt: 0.60
    help: "Benutzerdefiniert — ρ/c/Z/kt editierbar."

  # --- Face ---
  titanium:
    name: Titanium (Ti-6Al-4V approx)
    rho_kg_m3: 4430
    c_m_s: 6100
    z_mrayl: 27.0
    attenuation_np_m_mhz: 0.5
    help: "Gesicht / Schale: Titan; Dicke 0.1–1.0 mm typ. (nicht veröffentlicht)."
  titanium_pvd:
    name: Titanium + PVD (Skinova 19-like)
    rho_kg_m3: 4430
    c_m_s: 6100
    z_mrayl: 27.4
    attenuation_np_m_mhz: 0.55
    help: "Leichte Z-Anhebung als Kalibrierung für PVD-Beschichtung."
  stainless:
    name: Stainless steel (what-if)
    rho_kg_m3: 7800
    c_m_s: 5800
    z_mrayl: 45.2
    attenuation_np_m_mhz: 1.0
    help: "What-if Gesicht — nicht Skinova-Standard."
  face_custom:
    name: Custom face
    rho_kg_m3: 4430
    c_m_s: 6100
    z_mrayl: 27.0
    attenuation_np_m_mhz: 0.5
    help: "Benutzerdefiniertes Gesichtsmaterial."

  # --- Glue ---
  glue_epoxy:
    name: Epoxy acoustic bond
    rho_kg_m3: 1200
    c_m_s: 2500
    z_mrayl: 3.0
    attenuation_np_m_mhz: 50.0
    help: "Kleberschicht 1–50 µm typ.; dickere Schicht → mehr Fehlanpassung/Verlust."
  glue_cyano:
    name: Cyanoacrylate bond
    rho_kg_m3: 1100
    c_m_s: 2200
    z_mrayl: 2.4
    attenuation_np_m_mhz: 80.0
    help: "Dünnere typ. Schicht; Modellparameter."
  glue_silicone:
    name: Soft silicone bond
    rho_kg_m3: 1050
    c_m_s: 1000
    z_mrayl: 1.05
    attenuation_np_m_mhz: 120.0
    help: "Weiche Silikonbindung — hohe Dämpfung (Kalibrierung)."
  glue_thick:
    name: Thick bond preset
    rho_kg_m3: 1150
    c_m_s: 2300
    z_mrayl: 2.65
    attenuation_np_m_mhz: 70.0
    help: "Preset für dicken Kleber (geometrie + Material)."
  glue_custom:
    name: Custom glue
    rho_kg_m3: 1200
    c_m_s: 2500
    z_mrayl: 3.0
    attenuation_np_m_mhz: 50.0
    help: "Benutzerdefinierter Kleber."

  # --- Matching layer (optional between Ti and gel) ---
  matching_epoxy:
    name: Matching epoxy λ/4-ish
    rho_kg_m3: 1400
    c_m_s: 2800
    z_mrayl: 3.9
    attenuation_np_m_mhz: 20.0
    help: "Optionale Anpassschicht Ti→Gel (Kalibrierung)."
  matching_polymer:
    name: Matching polymer
    rho_kg_m3: 1180
    c_m_s: 2700
    z_mrayl: 3.2
    attenuation_np_m_mhz: 25.0
    help: "Polymer-Anpassschicht."

  # --- Backing ---
  backing_air:
    name: Air backing
    rho_kg_m3: 1.2
    c_m_s: 343
    z_mrayl: 0.0004
    attenuation_np_m_mhz: 0.0
    help: "Luft hinter Piezo → schmalbandig, höhere Q."
  backing_heavy:
    name: Heavy backing (tungsten-epoxy approx)
    rho_kg_m3: 4500
    c_m_s: 2200
    z_mrayl: 9.9
    attenuation_np_m_mhz: 80.0
    help: "Schwere Dämpfung → breitere Bandbreite, weniger Ringing."

  # --- Loads ---
  gel:
    name: Ultrasound gel
    rho_kg_m3: 1010
    c_m_s: 1480
    z_mrayl: 1.5
    attenuation_np_m_mhz: 2.0
  water:
    name: Water
    rho_kg_m3: 998
    c_m_s: 1480
    z_mrayl: 1.48
    attenuation_np_m_mhz: 0.025
  tissue:
    name: Soft tissue
    rho_kg_m3: 1050
    c_m_s: 1540
    z_mrayl: 1.62
    attenuation_np_m_mhz: 12.0
  fat:
    name: Fat (calib)
    rho_kg_m3: 950
    c_m_s: 1450
    z_mrayl: 1.38
    attenuation_np_m_mhz: 8.0
  bone:
    name: Cortical bone (calib)
    rho_kg_m3: 1900
    c_m_s: 3500
    z_mrayl: 6.65
    attenuation_np_m_mhz: 40.0
  air:
    name: Air
    rho_kg_m3: 1.2
    c_m_s: 343
    z_mrayl: 0.0004
    attenuation_np_m_mhz: 0.0
  load_custom:
    name: Custom load
    rho_kg_m3: 1050
    c_m_s: 1540
    z_mrayl: 1.62
    attenuation_np_m_mhz: 12.0

defaults:
  f0_hz: 19000000
  drive_level: 1.0
  load: gel_tissue          # air | water | gel | soft_tissue | fat | bone | gel_tissue
  piezo_material: pzt8
  glue_material: glue_epoxy
  face_material: titanium
  ti_thickness_m: 0.0003
  ti_diameter_m: 0.01954
  piezo_thickness_m: null
  piezo_diameter_m: 0.018
  glue_thickness_m: 0.00001
  gel_thickness_m: 0.0003
  matching_enabled: false
  matching_material: matching_epoxy
  matching_thickness_m: 0.00005
  backing: air              # air | heavy
  stack_efficiency: 0.65
  kt: 0.64
  spectrum_span: 0.15

ranges:
  ti_thickness_m: [0.0001, 0.001]
  piezo_thickness_m: [0.00005, 0.0025]
  piezo_diameter_m: [0.010, 0.01954]
  glue_thickness_m: [0.000001, 0.00005]
  gel_thickness_m: [0.00005, 0.001]
  matching_thickness_m: [0.00001, 0.0002]
  drive_level: [0.05, 1.0]
  spectrum_span: [0.05, 0.5]

presets:
  thin_glue:
    glue_thickness_m: 0.000002
    glue_material: glue_cyano
  thick_glue:
    glue_thickness_m: 0.000040
    glue_material: glue_thick
  air_load:
    load: air
  gel_load:
    load: gel
  clinical_1mhz:
    f0_hz: 1000000
    piezo_thickness_m: null
    face_material: titanium
  skinova_19:
    f0_hz: 19000000
    face_material: titanium_pvd
    glue_thickness_m: 0.000010
  clinical_3mhz:
    f0_hz: 3000000
  heavy_backing:
    backing: heavy
  with_matching:
    matching_enabled: true
    matching_thickness_m: 0.00005

notes:
  - "Titanium face/bowl and piezo/glue thicknesses are NOT published by the manufacturer."
  - "Suggested piezo thickness = c_pzt / (2*f0) (λ/2 thickness-mode)."
  - "Effective radiating diameter follows from ERA=3 cm² → d_eq≈19.5 mm."
  - "Air load → transmission ≈ 0, energy stays as heat in piezo/glue."
  - "Allowed f0 = {1,3,10,19} MHz; 1/3 MHz are clinical/LDM-class simulation options."
  - "x½ at 1/3 MHz is calibration (α∝f from 10 MHz manufacturer claim)."
  - "Matching layer and heavy backing are educational what-if options."
